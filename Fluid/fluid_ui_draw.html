<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fluid — Draw Obstacles (Baseline 1)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .spring-transition { transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .fade-transition   { transition: opacity 0.4s ease, transform 0.4s ease; }
  .sub-node          { transform: translate(calc(-50% + var(--sx,0px)), calc(-50% + var(--sy,0px))) scale(var(--scale,0)); }
  body { -webkit-font-smoothing:antialiased; overflow:hidden; background:#070a0f; touch-action:none; }

  #sim-stage { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(1); transform-origin:center center;
               width:585px; height:390px; z-index:0; touch-action:none; }
  #sim-canvas,#overlay-canvas,#draw-canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #sim-canvas { z-index:0; image-rendering:pixelated; }
  #overlay-canvas { z-index:1; pointer-events:none; }
  #draw-canvas { z-index:2; cursor:crosshair; }

  /* radial menu container must NOT block drawing on the field */
  #app { pointer-events:none; }

  .placeholder { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(ellipse at top,#0c1624,#020408); transition:opacity .6s; pointer-events:none; }
  .placeholder.hidden { opacity:0; }
  .spinner { width:30px; height:30px; border:3px solid #1e3a5f; border-top-color:#38bdf8; border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #re-badge { position:fixed; top:16px; right:20px; z-index:55; background:rgba(56,189,248,0.1); backdrop-filter:blur(12px);
    border:1px solid rgba(56,189,248,0.25); color:rgba(255,255,255,0.75); font-size:11px; letter-spacing:.1em; padding:5px 14px;
    border-radius:999px; font-family:'SF Mono','Cascadia Code',monospace; }
  #re-badge .re-num { color:#38bdf8; font-weight:700; }
  #material-badge { position:fixed; top:16px; left:20px; z-index:55; background:rgba(255,255,255,0.06); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.65); font-size:11px; letter-spacing:.1em; padding:5px 14px;
    border-radius:999px; font-family:'SF Mono','Cascadia Code',monospace; }
  #ws-status-bar { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:55; display:flex; align-items:center; gap:6px;
    font-size:11px; padding:5px 12px; border-radius:999px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    color:rgba(255,255,255,0.45); font-family:'SF Mono',monospace; }
  .ws-dot { width:8px; height:8px; border-radius:50%; background:#fbbf24; } .ws-dot.connected{ background:#34d399; box-shadow:0 0 6px #34d399; } .ws-dot.disconnected{ background:#f87171; }

  #speed-panel { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:14px; z-index:50;
    background:rgba(255,255,255,0.06); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.12); border-radius:999px;
    padding:10px 22px; font-family:'SF Mono','Cascadia Code',monospace; color:rgba(255,255,255,0.55); font-size:11px; letter-spacing:.08em; }
  #speed-val { min-width:40px; text-align:center; color:#38bdf8; font-weight:700; font-size:13px; }
  input[type=range]{ -webkit-appearance:none; width:220px; height:4px; border-radius:999px; outline:none; cursor:pointer;
    background:linear-gradient(to right,#38bdf8 var(--pct,40%),rgba(255,255,255,0.12) var(--pct,40%)); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#38bdf8;
    border:2px solid rgba(255,255,255,0.8); box-shadow:0 0 8px rgba(56,189,248,0.6); }
  #hint{ position:fixed; bottom:74px; left:50%; transform:translateX(-50%); z-index:50; font-size:10px; letter-spacing:.1em; color:rgba(255,255,255,.32); font-family:'SF Mono',monospace; }
  #toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(16px); z-index:60; opacity:0; transition:all .5s;
    background:rgba(255,255,255,0.08); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.75);
    padding:10px 22px; border-radius:999px; font-size:13px; letter-spacing:.06em; pointer-events:none; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
<link rel="stylesheet" href="../ui_theme.css">
<script src="../gesture_lock.js"></script>
</head>
<body class="h-screen w-full relative">

<div id="sim-stage">
  <canvas id="sim-canvas" width="585" height="390"></canvas>
  <canvas id="overlay-canvas" width="585" height="390"></canvas>
  <canvas id="draw-canvas" width="585" height="390"></canvas>
</div>
<div class="placeholder" id="placeholder"><div class="spinner"></div><span style="font-size:12px;letter-spacing:.12em;color:#4a7fa5">Connecting…</span></div>

<div id="ws-status-bar"><span id="ws-dot" class="ws-dot"></span><span id="ws-label">Connecting</span></div>
<div id="re-badge">Re = <span id="re-value" class="re-num">—</span></div>
<div id="material-badge">Air</div>

<div id="app" class="relative w-full h-full"></div>

<div id="speed-panel">
  <span style="letter-spacing:.12em;color:rgba(255,255,255,.4)">INLET</span>
  <input type="range" id="speed-slider" min="0.01" max="2.0" step="0.01" value="1.0">
  <span id="speed-val">40.0</span><span style="font-size:10px;color:rgba(255,255,255,.3)">m/s</span>
</div>
<div id="hint">draw or erase with one finger / mouse · Reset keeps obstacles · Clear wipes all</div>
<div id="toast">Action Hint</div>

<script>
const WS_URL='ws://localhost:8770';
const simW=585, simH=390;
const stage=document.getElementById('sim-stage');
const simCanvas=document.getElementById('sim-canvas'), simCtx=simCanvas.getContext('2d');
const ov=document.getElementById('overlay-canvas'), ovCtx=ov.getContext('2d');
const dc=document.getElementById('draw-canvas'), dcCtx=dc.getContext('2d');
const placeholder=document.getElementById('placeholder');

// ── view fit (no zoom: free-draw already makes any obstacle size) ──
function fitView(){ const base=Math.min(window.innerWidth/simW, window.innerHeight/simH)*0.92;
  stage.style.width=Math.round(simW*base)+'px'; stage.style.height=Math.round(simH*base)+'px'; }
fitView();
window.addEventListener('resize',()=>{fitView(); drawStrokes();});

// ── obstacle strokes + brush ───────────────────────────────
let strokes=[], cur=null, eraserOn=false;
let brushPx=24;
function brushNormR(){ return (brushPx/2)/simH; }
function norm(e){ const r=simCanvas.getBoundingClientRect();
  return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]; }
function drawStrokes(){
  dcCtx.clearRect(0,0,dc.width,dc.height); dcCtx.lineCap='round'; dcCtx.lineJoin='round';
  const all = cur? strokes.concat([cur]) : strokes;
  for(const s of all){ const w=s.r*2*dc.height; dcCtx.lineWidth=w;
    dcCtx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    dcCtx.strokeStyle='rgba(198,134,66,0.9)'; dcCtx.fillStyle='rgba(198,134,66,0.9)';
    if(s.pts.length===1){ const x=s.pts[0][0]*dc.width,y=s.pts[0][1]*dc.height; dcCtx.beginPath(); dcCtx.arc(x,y,w/2,0,7); dcCtx.fill(); continue; }
    dcCtx.beginPath(); s.pts.forEach((p,i)=>{ const x=p[0]*dc.width,y=p[1]*dc.height; i?dcCtx.lineTo(x,y):dcCtx.moveTo(x,y); }); dcCtx.stroke(); }
  dcCtx.globalCompositeOperation='source-over';
  // destination-out 会留下抗锯齿的低透明度像素；将障碍层转成明确的有/无掩膜。
  const pixels=dcCtx.getImageData(0,0,dc.width,dc.height);
  const data=pixels.data;
  for(let i=3;i<data.length;i+=4){
    if(data[i]<220) data[i]=0;
    else data[i]=230;
  }
  dcCtx.putImageData(pixels,0,0);
}
function sendObstacles(){ sendCommand('set_obstacles',null,{strokes}); }

// ── pointer handling: single-finger / mouse free draw ──────
let drawPid=null;
dc.addEventListener('pointerdown',e=>{ if(drawPid!==null) return; drawPid=e.pointerId; dc.setPointerCapture(e.pointerId);
  cur={pts:[norm(e)], r:brushNormR(), erase:eraserOn}; drawStrokes(); });
dc.addEventListener('pointermove',e=>{ if(e.pointerId!==drawPid || !cur) return; cur.pts.push(norm(e)); drawStrokes(); });
function endPointer(e){ if(e.pointerId!==drawPid) return; drawPid=null;
  if(cur){ if(cur.pts.length){ strokes.push(cur); sendObstacles(); } cur=null; drawStrokes(); } }
dc.addEventListener('pointerup',endPointer); dc.addEventListener('pointercancel',endPointer);

// ── WebSocket ──────────────────────────────────────────────
let ws=null,wsReady=false;
function sendCommand(action,value,extra){ if(ws&&wsReady) ws.send(JSON.stringify(Object.assign({action,value},extra||{}))); else showToast('Not connected'); }
async function onFrame(buf){ const bm=await createImageBitmap(new Blob([buf],{type:'image/jpeg'})); simCtx.drawImage(bm,0,0); bm.close(); placeholder.classList.add('hidden'); }
function connectWS(){
  const dot=document.getElementById('ws-dot'), label=document.getElementById('ws-label');
  dot.className='ws-dot'; label.textContent='Connecting';
  ws=new WebSocket(WS_URL); ws.binaryType='arraybuffer';
  ws.onopen=()=>{ wsReady=true; dot.className='ws-dot connected'; label.textContent='Connected'; if(strokes.length) sendObstacles(); showToast('Connected'); };
  ws.onmessage=e=>{ if(e.data instanceof ArrayBuffer){ onFrame(e.data); return; }
    const msg=JSON.parse(e.data);
    if(msg.type==='reynolds'){ const re=msg.value; document.getElementById('re-value').textContent=re>=10000?(re/1000).toFixed(1)+'k':Math.round(re).toLocaleString();
      const b=document.getElementById('re-badge'); b.style.borderColor=re<2300?'rgba(52,211,153,0.4)':re<4000?'rgba(251,191,36,0.4)':'rgba(248,113,113,0.4)'; }
    if(msg.type==='arrows'){ drawArrows(msg.data||[]); }
    if(msg.type==='state'){ applyBackendState(msg); }
  };
  ws.onclose=()=>{ wsReady=false; dot.className='ws-dot disconnected'; label.textContent='Disconnected'; placeholder.classList.remove('hidden'); drawArrows([]); setTimeout(connectWS,2500); };
  ws.onerror=()=>{ wsReady=false; dot.className='ws-dot disconnected'; };
}
function drawArrows(flat){ ovCtx.clearRect(0,0,ov.width,ov.height); if(!flat.length) return; ovCtx.lineWidth=2; ovCtx.lineCap='round';
  for(let i=0;i+4<flat.length;i+=5){ const ox=flat[i],oy=flat[i+1],dx=flat[i+2],dy=flat[i+3],mag=flat[i+4];
    const t=Math.min(1,mag/500), col=`rgba(${Math.round(68+t*90)},${Math.round(190+t*55)},${Math.round(255-t*70)},0.95)`;
    const sx=ox*ov.width, sy=(1-oy)*ov.height, ex=(ox+dx)*ov.width, ey=(1-(oy+dy))*ov.height;
    if(Math.hypot(ex-sx,ey-sy)<3) continue; ovCtx.strokeStyle=col; ovCtx.beginPath(); ovCtx.moveTo(sx,sy); ovCtx.lineTo(ex,ey); ovCtx.stroke(); }
}

// ── speed slider (same as original) ────────────────────────
const slider=document.getElementById('speed-slider'), speedVal=document.getElementById('speed-val');
let MIN=0.01,MAX=2.0,sliderTimeout=null;
function updateSliderUI(){ const v=parseFloat(slider.value); slider.style.setProperty('--pct',Math.min(100,Math.max(0,(v-MIN)/(MAX-MIN)*100))+'%'); speedVal.textContent=v.toFixed(2); }
function setSliderFromBackend(v){ const n=Number(v); if(!Number.isFinite(n))return; slider.value=Math.min(MAX,Math.max(MIN,n)).toFixed(3); updateSliderUI(); }
slider.addEventListener('input',()=>{ updateSliderUI(); clearTimeout(sliderTimeout); sliderTimeout=setTimeout(()=>{ const s=parseFloat(slider.value); sendCommand('set_speed',s); showToast('Inlet Speed: '+s.toFixed(2)+' m/s'); },120); });
updateSliderUI();

// ── Radial menu (ported from fluid_ui.html, identical style) ─
const MAT_NAMES=['air','water','honey'], VIZ_NAMES=['Smoke','Velocity','Vortex','Pressure'];
const BRUSH_NAMES=['Small','Medium','Large'], BRUSH_PX={Small:12,Medium:24,Large:44};
const svgURI=s=>'data:image/svg+xml;utf8,'+encodeURIComponent(s);
const dotIcon=r=>svgURI(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="white"/></svg>`);
const eraserIcon=svgURI('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="7" stroke-linejoin="round"><path d="M18 62 L55 19 L84 44 L48 82 H31 Z"/><path d="M48 82 H86"/><path d="M38 39 L67 65"/></svg>');
const clearIcon=svgURI('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 32 H76"/><path d="M40 32 V22 H60 V32"/><path d="M30 32 L35 80 H65 L70 32"/></svg>');
const ICON_MAP={
  'air':'./icons/Material/air.png','water':'./icons/Material/water.png','honey':'./icons/Material/honey.png',
  'Smoke':'./icons/Visualization/smoke.png','Velocity':'./icons/Visualization/velocity.png','Vortex':'./icons/Visualization/vortex.png','Pressure':'./icons/Visualization/pressure.png',
  'Small':dotIcon(10),'Medium':dotIcon(22),'Large':dotIcon(36),
};
const iconSrc=k=>ICON_MAP[k] ?? dotIcon(22);
const toggleIconMap={ 'streamline':'./icons/Visualization/streamline.png', 'eraser':eraserIcon };

const menus=[
  { type:'radial', id:'material',   name:'Material',   params:MAT_NAMES,   selectedParam:'air',   wsAction:'set_material' },
  { type:'radial', id:'viz',        name:'Visualize',  params:VIZ_NAMES,   selectedParam:'Smoke', wsAction:'set_viz' },
  { type:'toggle', id:'streamline', name:'Streamline', wsAction:'toggle_streamline', isOn:false },
  { type:'button', id:'reset',      name:'Reset',      icon:'./icons/Visualization/reset.png' },
  { type:'radial', id:'brush',      name:'Brush',      params:BRUSH_NAMES, selectedParam:'Medium' },
  { type:'toggle', id:'eraser',     name:'Eraser',     isOn:false },
  { type:'button', id:'clear',      name:'Clear',      icon:clearIcon },
];
function menuById(id){ return menus.find(m=>m.id===id); }
function fmtMat(n){ return n? n.charAt(0).toUpperCase()+n.slice(1):'Air'; }

let currentState='IDLE', activeMenuIndex=-1;
const app=document.getElementById('app');
const radialRadius=120, spacing=150;
const mainBase='relative flex items-center justify-center w-20 h-20 rounded-full cursor-pointer backdrop-blur-md transition-all duration-500 ease-out z-20 group';
const subBase='sub-node absolute top-1/2 left-1/2 flex items-center justify-center w-16 h-16 rounded-full cursor-pointer backdrop-blur-md border transition-all duration-300 z-10 group bg-gradient-to-br from-white/10 to-white/5 border-white/20 hover:from-white/20 hover:to-white/10';

menus.forEach((menu,i)=>{
  const group=document.createElement('div'); group.className='absolute top-[72px] left-1/2 spring-transition'; group.id=`group-${i}`;
  const mainCircle=document.createElement('div'); mainCircle.id=`main-${i}`; mainCircle.className=mainBase;
  if(menu.type!=='button'){
    const img=document.createElement('img'); img.id=`main-img-${i}`;
    img.src=menu.type==='radial'? iconSrc(menu.selectedParam) : (toggleIconMap[menu.id] ?? dotIcon(22));
    img.className='w-[100%] h-[100%] object-contain drop-shadow-[0_4px_8px_rgba(0,0,0,0.4)] group-hover:scale-110 transition-transform duration-300'; img.draggable=false; mainCircle.appendChild(img);
  } else {
    const ico=document.createElement('img'); ico.src=menu.icon||'./icons/Visualization/reset.png';
    ico.className='w-[100%] h-[100%] object-contain drop-shadow-[0_4px_8px_rgba(0,0,0,0.4)] group-hover:scale-110 transition-transform duration-300'; ico.draggable=false; mainCircle.appendChild(ico);
  }
  const labelBox=document.createElement('div'); labelBox.id=`label-${i}`;
  labelBox.className='absolute top-[calc(100%+14px)] left-1/2 -translate-x-1/2 px-4 py-1.5 backdrop-blur-md border text-slate-100 font-medium text-sm tracking-widest rounded-full whitespace-nowrap fade-transition opacity-0 pointer-events-none z-30';
  labelBox.style.cssText='background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);'; labelBox.textContent=menu.name; mainCircle.appendChild(labelBox);
  {
    const selLabel=document.createElement('div'); selLabel.id=`main-sel-label-${i}`;
    selLabel.className='absolute top-[calc(100%+8px)] left-1/2 -translate-x-1/2 text-[10px] whitespace-nowrap transition-all duration-300 font-medium tracking-wider pointer-events-none';
    selLabel.style.color='rgba(255,255,255,0.4)'; selLabel.textContent=menu.type==='radial'?menu.selectedParam:(menu.type==='toggle'?(menu.isOn?'ON':'OFF'):menu.name); mainCircle.appendChild(selLabel);
  }
  mainCircle.addEventListener('click',e=>{ e.stopPropagation(); handleMainClick(i); });
  group.appendChild(mainCircle);
  if(menu.type==='radial'){
    const subCont=document.createElement('div'); subCont.className='absolute inset-0 z-10 pointer-events-none'; const N=menu.params.length;
    menu.params.forEach((param,pi)=>{
      const sub=document.createElement('div'); sub.className=subBase+` sub-${i}`;
      const img=document.createElement('img'); img.src=iconSrc(param); img.className='w-[100%] h-[100%] object-contain drop-shadow-[0_3px_6px_rgba(0,0,0,0.4)]'; img.draggable=false; sub.appendChild(img);
      const subLabel=document.createElement('div'); subLabel.className='absolute top-1/2 left-1/2 text-[10px] whitespace-nowrap font-medium tracking-wider pointer-events-none'; subLabel.style.color='rgba(255,255,255,0.5)'; subLabel.textContent=param;
      const totalSpread=Math.min(140,24*N), startAngle=90-totalSpread/2; const angle=N===1?90:startAngle+(totalSpread/(N-1))*pi; const rad=angle*Math.PI/180;
      const sx=radialRadius*Math.cos(rad), sy=radialRadius*Math.sin(rad), lx=Math.cos(rad)*44, ly=Math.sin(rad)*44, tx=-50+Math.cos(rad)*50, ty=-50+Math.sin(rad)*50;
      subLabel.style.transform=`translate(calc(${tx}% + ${lx}px), calc(${ty}% + ${ly}px))`; sub.appendChild(subLabel);
      sub.style.setProperty('--sx',sx+'px'); sub.style.setProperty('--sy',sy+'px'); sub.style.transitionDelay=pi*0.03+'s';
      sub.addEventListener('click',e=>{ e.stopPropagation(); handleSubClick(i,pi,param); }); subCont.appendChild(sub);
    });
    group.appendChild(subCont);
  }
  app.appendChild(group);
});
document.body.addEventListener('click',()=>{ if(currentState!=='IDLE'){ currentState='IDLE'; activeMenuIndex=-1; updateDOM(); } });

function handleMainClick(index){
  const menu=menus[index];
  if(menu.type==='button'){
    if(menu.id==='reset'){ sendCommand('reset',null); showToast('Flow reset (obstacles kept)'); }
    else if(menu.id==='clear'){ strokes=[]; cur=null; drawStrokes(); sendCommand('clear_obstacles',null); showToast('Obstacles cleared'); }
    return;
  }
  if(currentState==='IDLE'){ currentState='FOCUSED'; activeMenuIndex=index; }
  else if(currentState==='FOCUSED'){ if(index===activeMenuIndex){ if(menu.type==='radial'){ currentState='EXPANDED'; }
      else { menu.isOn=!menu.isOn;
        if(menu.id==='eraser'){ eraserOn=menu.isOn; dc.style.cursor=eraserOn?'cell':'crosshair'; }
        else sendCommand(menu.wsAction,menu.isOn);
        showToast(menu.name+': '+(menu.isOn?'ON':'OFF')); } } else { activeMenuIndex=index; } }
  else if(currentState==='EXPANDED'){ if(index===activeMenuIndex){ currentState='IDLE'; activeMenuIndex=-1; } else { currentState='FOCUSED'; activeMenuIndex=index; } }
  updateDOM();
}
function handleSubClick(menuIndex,paramIndex,paramName){
  const menu=menus[menuIndex]; menu.selectedParam=paramName;
  if(menu.id==='material'){ sendCommand('set_material',paramName); document.getElementById('material-badge').textContent=fmtMat(paramName); showToast('Material: '+paramName); }
  else if(menu.id==='viz'){ sendCommand('set_viz',paramName.toLowerCase()); showToast('Visualize: '+paramName); }
  else if(menu.id==='brush'){ brushPx=BRUSH_PX[paramName]; showToast('Brush: '+paramName); }
  currentState='IDLE'; activeMenuIndex=-1; updateDOM();
}
function updateDOM(){
  const N=menus.length;
  menus.forEach((menu,i)=>{
    const group=document.getElementById(`group-${i}`), mainCircle=document.getElementById(`main-${i}`), mainImg=document.getElementById(`main-img-${i}`),
      selLabel=document.getElementById(`main-sel-label-${i}`), label=document.getElementById(`label-${i}`), subNodes=document.querySelectorAll(`.sub-${i}`);
    const responsiveSpacing=Math.min(spacing,Math.max(88,(window.innerWidth-120)/Math.max(1,N-1)));
    let xOffset=0,scale=1,opacity=0.6,isLabelVisible=false,zIndex=10,subScale=0; const defaultX=(i-(N-1)/2)*responsiveSpacing;
    const activeRing='bg-gradient-to-br from-sky-400/20 to-sky-400/5 border border-sky-400/50 shadow-[inset_2px_2px_8px_rgba(56,189,248,0.2),0_8px_24px_rgba(56,189,248,0.25)]';
    const defaultRing='bg-gradient-to-br from-white/10 to-white/5 border border-white/15 shadow-[inset_2px_2px_6px_rgba(255,255,255,0.08),0_8px_20px_rgba(0,0,0,0.4)]';
    const focusRing='bg-gradient-to-br from-white/20 to-white/8 border border-white/30 shadow-[inset_2px_2px_10px_rgba(255,255,255,0.15),0_12px_32px_rgba(0,0,0,0.5)]';
    const expandRing='bg-white/15 border border-white/40 shadow-[inset_2px_2px_12px_rgba(255,255,255,0.2),0_16px_40px_rgba(0,0,0,0.6)]';
    let ringClass=menu.type==='toggle'&&menu.isOn?activeRing:defaultRing;
    if(menu.type==='radial'&&mainImg){ mainImg.src=iconSrc(menu.selectedParam); if(selLabel){ selLabel.textContent=menu.selectedParam; selLabel.style.color='rgba(255,255,255,0.4)'; } }
    else if(menu.type==='toggle'&&selLabel){ selLabel.textContent=menu.isOn?'ON':'OFF'; selLabel.style.color=menu.isOn?'#38bdf8':'rgba(255,255,255,0.4)'; }
    if(currentState==='IDLE'){ xOffset=defaultX; opacity=menu.type==='toggle'&&menu.isOn?0.9:0.6; }
    else if(currentState==='FOCUSED'){ xOffset=defaultX; if(i===activeMenuIndex){ opacity=1; scale=1.15; isLabelVisible=true; zIndex=50; ringClass=focusRing; } else { opacity=menu.type==='toggle'&&menu.isOn?0.7:0.3; } }
    else if(currentState==='EXPANDED'){ xOffset=defaultX; if(i===activeMenuIndex&&menu.type==='radial'){ opacity=1; scale=1.1; subScale=1; zIndex=50; ringClass=expandRing; } else { opacity=0; scale=0.82; } }
    group.style.transform=`translate(calc(-50% + ${xOffset}px), 0%) scale(${scale})`; group.style.opacity=opacity; group.style.zIndex=zIndex;
    group.style.pointerEvents=opacity<0.1?'none':'auto'; mainCircle.className=mainBase+' '+ringClass;
    if(isLabelVisible){ label?.classList.remove('opacity-0'); label?.classList.add('opacity-100'); } else { label?.classList.add('opacity-0'); label?.classList.remove('opacity-100'); }
    subNodes.forEach(sub=>{ sub.style.setProperty('--scale',subScale); sub.style.opacity=subScale===1?1:0; sub.style.pointerEvents=subScale===1?'auto':'none'; });
  });
}
function applyBackendState(state){
  if(Number.isFinite(Number(state.wind_speed_min_mps))){ MIN=Number(state.wind_speed_min_mps); slider.min=String(MIN); }
  if(Number.isFinite(Number(state.wind_speed_max_mps))){ MAX=Number(state.wind_speed_max_mps); slider.max=String(MAX); }
  if(Number.isFinite(Number(state.wind_speed_step_mps))){ slider.step=String(Number(state.wind_speed_step_mps)); }
  const mm=menuById('material'); if(mm&&MAT_NAMES.includes(state.material)){ mm.selectedParam=state.material; document.getElementById('material-badge').textContent=fmtMat(state.material); }
  if(state.speed_mps!==undefined) setSliderFromBackend(state.speed_mps);
  const vizName=typeof state.viz==='string'? state.viz.charAt(0).toUpperCase()+state.viz.slice(1).toLowerCase():'';
  const vm=menuById('viz'); if(vm&&VIZ_NAMES.includes(vizName)) vm.selectedParam=vizName;
  const sm=menuById('streamline'); if(sm&&state.streamline!==undefined) sm.isOn=Boolean(state.streamline);
  updateDOM();
}

// ── toast ──────────────────────────────────────────────────
let toastTO;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTO); toastTO=setTimeout(()=>t.classList.remove('show'),2200); }

document.getElementById('material-badge').textContent='Air';
updateDOM();
window.addEventListener('resize',updateDOM);
connectWS();
</script>
